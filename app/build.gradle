plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.tekphreak.darkbook'
    compileSdk 34

    defaultConfig {
        applicationId "com.tekphreak.darkbook"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions = ["tier"]
    productFlavors {
        free {
            dimension "tier"
            // applicationId stays com.tekphreak.darkbook — the existing, ad-supported app.
            buildConfigField "boolean", "SHOW_ADS", "true"
        }
        pro {
            dimension "tier"
            applicationIdSuffix ".pro"
            versionNameSuffix "-pro"
            buildConfigField "boolean", "SHOW_ADS", "false"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

configurations.all {
    resolutionStrategy {
        // androidx.biometric:1.1.0 strictly pins fragment to 1.2.5, whose
        // FragmentActivity predates the fix for how ActivityResultRegistry
        // (rememberLauncherForActivityResult / PickVisualMedia) generates
        // request codes — that mismatch crashes with "Can only use lower
        // 16 bits for requestCode" the moment a launcher is invoked.
        force 'androidx.fragment:fragment:1.6.2'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    implementation platform('androidx.compose:compose-bom:2024.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Encrypted local storage
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    // Lock screen + PIN
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Location capture for entries
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // Banner ads — free flavor only, Pro carries none of this.
    // Pinned below 24.x: those releases ship Kotlin 2.x metadata that this
    // project's Kotlin 1.9.22 kapt can't reliably parse (intermittent
    // "incompatible version of Kotlin" compile failures).
    freeImplementation 'com.google.android.gms:play-services-ads:23.6.0'
}
